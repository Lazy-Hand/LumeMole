name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # the draft release, and the uploads to it

jobs:
  # The draft exists before the build starts so `mygo build -upload` has
  # a release to put the installers and update files in. Its body is the
  # tag's section of CHANGELOG.md, which the update window shows too,
  # plus the compare link of generated notes.
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The version's section of CHANGELOG.md: its heading and the
          # leading blank line left out, up to the next ## heading.
          notes="$(awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { insec = 1; next }
            insec && /^## / { insec = 0 }
            insec && ($0 != "" || started) { started = 1; print }
          ' CHANGELOG.md)"
          test -n "$notes" || { echo "CHANGELOG.md has no section for $version" >&2; exit 1; }
          prev="$(git ls-remote --tags origin 'v*' | grep -vF "$GITHUB_REF_NAME" \
            | grep -oE 'refs/tags/.*' | cut -d/ -f3 | sort -V | tail -1)"
          if [ -n "$prev" ]; then
            notes="$notes

          **Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
          fi
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --notes "$notes"
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          fi

  build-macos:
    needs: draft-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set version from tag
        # The tag is the version of record; stamp it into mygo.json so the
        # bundle, the update manifest and the release agree (v1.2.3 -> 1.2.3).
        run: |
          sed -i '' "s/\"version\": \".*\"/\"version\": \"${GITHUB_REF_NAME#v}\"/" mygo.json

      - name: Test
        run: go test ./...

      # Import the Apple Development signing cert+key into a throwaway
      # keychain so every build carries the same identity — TCC (Full Disk
      # Access etc.) then survives updates instead of re-prompting each
      # release. Without these secrets the build falls back to ad-hoc.
      - name: Set up code signing
        env:
          APPLE_SIGNING_P12: ${{ secrets.APPLE_SIGNING_P12 }}
          APPLE_SIGNING_P12_PASSWORD: ${{ secrets.APPLE_SIGNING_P12_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_SIGNING_P12" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "No signing secrets configured — building ad-hoc."
            exit 0
          fi
          KEYCHAIN=build-signing.keychain-db
          KEYCHAIN_PASSWORD="$(openssl rand -base64 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_SIGNING_P12" | base64 --decode > signing.p12
          security import signing.p12 -k "$KEYCHAIN" \
            -P "$APPLE_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm signing.p12
          # Point mygo at the real identity for this build. Handles both
          # existing macos.signingIdentity and a missing macos block.
          python3 -c "import json; cfg = json.load(open('mygo.json')); cfg.setdefault('macos', {})['signingIdentity'] = '$APPLE_SIGNING_IDENTITY'; json.dump(cfg, open('mygo.json', 'w'), indent=2, ensure_ascii=False)"
          echo "Signing with: $APPLE_SIGNING_IDENTITY"

      # Universal covers Apple silicon and Intel in one archive. Signs the
      # update with MYGO_UPDATER_PRIVATE_KEY and uploads the DMG, the signed
      # update archive and update-darwin-universal.json to the draft release.
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          go run github.com/egoist/mygo/cmd/mygo build \
            -platform darwin/universal -upload

  publish:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
